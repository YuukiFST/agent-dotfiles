# Herdr UI settings this repo owns. sync-config.ps1 herdr passes each key to
# `herdr-gpui config set`, so keys the app writes itself (dialog "do not ask
# again" choices) stay in config-gpui.local.toml.
# Strings use single quotes: PowerShell 5.1 drops double quotes inside native
# arguments. One key per line, tables as [name]; no inline tables.

layout = 'comfortable-rounded'
# Vercel Dark from vercel.com/geist/terminal; the files are herdr/themes/,
# copied to %APPDATA%\herdr\themes.
theme = '~/AppData/Roaming/herdr/themes/vercel-dark'

[backdrop]
opacity = 1.0

[terminal]
# Ioskeley Mono Term Nerd Font Mono, installed by setup-herdr.ps1; its family
# name has no typographic variant, so DirectWrite and GDI agree on it.
# GeistMono NFM, also installed there, covers what it lacks.
family = 'IoskeleyMonoTerm Nerd Font Mono'
fallback = ['GeistMono NFM']
size = 14
