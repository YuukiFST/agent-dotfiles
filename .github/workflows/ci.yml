name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  commit-message-rules:
    name: Commit message regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rules/git.md 4.2 requires these tests after any change to the trailer
      # patterns. Running them here is what makes that requirement real.
      - name: Run validate-commit-message regression tests
        run: bash git-hooks/test-validate-commit-message.sh

  shell:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # commit-msg and pre-push have no .sh extension, so a *.sh glob misses
      # exactly the two files that gate every commit and push.
      # -x follows the sourced validate-commit-message.sh instead of reporting
      # SC1091 at every call site.
      # Skill scripts sit one or two levels deep (skills/<name>/, skills/<name>/scripts/),
      # so find them instead of globbing; a glob that matches nothing is passed literally.
      - name: Shellcheck hooks and scripts
        run: shellcheck -x --severity=warning git-hooks/*.sh scripts/*.sh git-hooks/commit-msg git-hooks/pre-push scripts/show-shot $(find skills -name '*.sh')

  ai-tells-lint:
    name: ai-tells lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Golden files pin every lint finding, and the id check fails when a lint rule or an
      # ai-tells#<id> citation in another skill points at a pattern patterns.md no longer has.
      - name: Run ai-tells lint regression and id consistency tests
        run: bash skills/ai-tells/tests/run.sh

  security-audit-validators:
    name: security-audit validators (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The Windows fallback in both validators diverges from upstream for good
      # (cloudflare/security-audit-skill#69 closed unmerged), so only this job catches a
      # mistake when it is applied again after an upstream update. Ubuntu runs the
      # FIFO and symlink cases that Windows skips.
      - name: Run the validator tests
        run: node --test skills/security-audit/validate-findings.test.cjs skills/security-audit/validate-coverage-ledger.test.cjs

  skill-frontmatter:
    name: Skill frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A SKILL.md whose frontmatter does not parse loads with no description and
      # silently loses its triggers (PR #97). yq comes preinstalled on the runner.
      - name: Run check-skill-frontmatter regression tests
        run: bash scripts/test-check-skill-frontmatter.sh

      - name: Validate every SKILL.md frontmatter
        run: bash scripts/check-skill-frontmatter.sh
