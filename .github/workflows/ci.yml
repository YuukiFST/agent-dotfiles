name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  commit-message-rules:
    name: Commit message regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # This job is what runs these tests; no rule asks agents to run them by hand.
      - name: Run validate-commit-message regression tests
        run: bash git-hooks/test-validate-commit-message.sh

      - name: Run pre-push end-to-end tests
        run: bash git-hooks/test-pre-push.sh

  coding-standards-gate:
    name: coding-standards-gate hook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Also fails when CODING_STANDARDS.md outgrows the 10,000-character additionalContext cap.
      - name: Run coding-standards-gate end-to-end test
        run: bash scripts/test-coding-standards-gate.sh

  shell:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # commit-msg and pre-push have no .sh extension, so a *.sh glob misses
      # exactly the two files that gate every commit and push.
      # -x follows the sourced validate-commit-message.sh instead of reporting
      # SC1091 at every call site.
      # Skill scripts sit one or two levels deep (skills/<name>/, skills/<name>/scripts/),
      # so find them instead of globbing; a glob that matches nothing is passed literally.
      - name: Shellcheck hooks and scripts
        run: shellcheck -x --severity=warning git-hooks/*.sh scripts/*.sh git-hooks/commit-msg git-hooks/pre-push scripts/show-shot $(find skills -name '*.sh')

  sync-pi:
    name: sync-config pi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A package.json synced into ~/.pi/agent reaches pi's CommonJS launcher in bin/
      # and breaks every pi command on Windows (#148, #150).
      - name: Run sync-config pi regression test
        run: bash scripts/test-sync-pi.sh

  sync-opencode:
    name: sync-config opencode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Skill /name commands must not be shadowed by generated wrappers, and removing the retired
      # fff MCP server must keep every other key of a commented opencode.jsonc.
      - name: Run sync-config opencode test
        run: bash scripts/test-sync-opencode.sh

      # OpenCode 2 loads the TUI half of a plugin only from cli.json; adding one must keep the
      # machine's other keys and stay a no-op on a rerun.
      - name: Run add-opencode-tui-plugin test
        run: bash scripts/test-add-opencode-tui-plugin.sh

      # A directory the OpenCode server has not loaded answers with the TUI half of the goal
      # plugin only; the check and the setup must poll instead of trusting the first answer.
      - name: Run opencode-plugins cold-directory regression test
        run: bash scripts/test-regression-opencode-plugins-cold-directory.sh

  browser-harness-install:
    name: browser-harness install
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # uv tool install --force fails halfway on Windows while a daemon holds the tool's Scripts dir.
      - name: Run browser-harness daemon regression test
        run: pwsh -NoProfile -File scripts/test-regression-browser-harness-daemon.ps1

  rtk-install-linux:
    name: rtk install (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Every setup script installs the rtk build pinned in scripts/rtk-pin.txt; a pin whose
      # hash does not match the release must install nothing.
      - name: Run install-rtk.sh end-to-end test
        run: bash scripts/test-install-rtk.sh

  rtk-install-windows:
    name: rtk install (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run install-rtk.ps1 end-to-end test
        run: pwsh -NoProfile -File scripts/test-install-rtk.ps1

  ai-tells-lint:
    name: ai-tells lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Golden files pin every lint finding, and the id check fails when a lint rule or an
      # ai-tells#<id> citation in another skill points at a pattern patterns.md no longer has.
      - name: Run ai-tells lint regression and id consistency tests
        run: bash skills/ai-tells/tests/run.sh

  security-audit-validators:
    name: security-audit validators (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # The Windows fallback in both validators diverges from upstream for good
      # (cloudflare/security-audit-skill#69 closed unmerged), so only this job catches a
      # mistake when it is applied again after an upstream update. Ubuntu runs the
      # FIFO and symlink cases that Windows skips. Every local divergence is listed in
      # docs/security-audit-upstream-divergence.md.
      - name: Run the validator tests
        run: node --test skills/security-audit/validate-findings.test.cjs skills/security-audit/validate-coverage-ledger.test.cjs skills/security-audit/validate-citations.test.cjs skills/security-audit/validate-artifact-content.test.cjs skills/security-audit/scanner-seeds.test.cjs skills/security-audit/finding-semantics.test.cjs skills/security-audit/chain-findings.test.cjs skills/security-audit/export-sarif.test.cjs

  perf-ratchet:
    name: perf-ratchet (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # count.mjs tests skip without Valgrind, which runs on Linux only.
      - name: Install valgrind
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y valgrind

      # probe.mjs reads /proc on Linux and Win32_Process on Windows, so each OS
      # runs its own sampler.
      - name: Run the ratchet, probe and count end-to-end tests
        run: node --test skills/perf-ratchet/scripts/ratchet.test.mjs

  agent-cli:
    name: agent-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # agent-cli check reads its job list from this file, so a job shape the parser misses
      # disappears from local runs without an error; the fixture ci.yml pins the shapes used here.
      - name: Run agent-cli end-to-end tests
        run: bash scripts/test-agent-cli.sh

  check-upstreams:
    name: check-upstreams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A stub gh serves canned API output; the weekly upstreams.yml run is the live check.
      - name: Run check-upstreams end-to-end tests
        run: bash scripts/test-check-upstreams.sh

  skill-frontmatter:
    name: Skill frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A SKILL.md whose frontmatter does not parse loads with no description and
      # silently loses its triggers (PR #97). yq comes preinstalled on the runner.
      - name: Run check-skill-frontmatter regression tests
        run: bash scripts/test-check-skill-frontmatter.sh

      - name: Validate every SKILL.md frontmatter
        run: bash scripts/check-skill-frontmatter.sh

  skill-routes-and-links:
    name: Skill routes and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # yuu-mode quietly takes the next-best route when a routed skill is missing, so a
      # dead or missing route never fails at runtime (issue #279).
      - name: Run check-yuu-mode-routes regression tests
        run: bash scripts/test-check-yuu-mode-routes.sh

      - name: Check yuu-mode routes against skills/
        run: bash scripts/check-yuu-mode-routes.sh

      # skill-diet's checker resolves every relative link and #anchor in a skill's .md files.
      - name: Check links in every skill
        run: |
          status=0
          for dir in skills/*/; do
            out="$(node skills/skill-diet/scripts/eval.mjs check "$dir")" || { printf '%s\n%s\n' "$dir" "$out"; status=1; }
          done
          exit "$status"
